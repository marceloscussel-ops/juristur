    <defs>
      <clipPath id="s">
        <path d="M16 15 L80 15 C84 15 86 18 86 22 L86 50 C86 72 70 86 48 92 C26 86 10 72 10 50 L10 22 C10 18 12 15 16 15 Z"/>
      </clipPath>
    </defs>
    <path d="M16 15 L80 15 C84 15 86 18 86 22 L86 50 C86 72 70 86 48 92 C26 86 10 72 10 50 L10 22 C10 18 12 15 16 15 Z" fill="#F7F9FB"/>
    <polygon points="58,0 96,0 96,96 38,96" fill="#5B57E8" clip-path="url(#s)"/>
    <text x="48" y="52" text-anchor="middle" dominant-baseline="central" font-family="Arial Black, Arial, sans-serif" font-weight="800" font-size="33" letter-spacing="-1.5" fill="#16202F">TG</text>
  </g>
